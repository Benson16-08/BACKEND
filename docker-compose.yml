# ─────────────────────────────────────────────────────────────────────────────
# MediAssist docker-compose.yml
# Wires the backend API together with Ollama for local demo
#
# Usage:
#   docker compose up          # start both services
#   docker compose down        # stop and remove containers
#   docker compose logs -f api # follow API logs
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── MediAssist Backend API ─────────────────────────────────────────────────
  api:
    build: .
    container_name: mediassist-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Ollama URL to use the service name, not localhost
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      # Mount KB so changes to knowledge_base don't require a rebuild
      - ./knowledge_base:/app/knowledge_base:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Ollama — local Llama 3 server ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mediassist-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local
